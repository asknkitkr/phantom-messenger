[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-messenger"
version = "1.0.0"
description = "Offline encrypted peer-to-peer messenger over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "bleak>=1.1.1",
    "bless>=0.3.0",
    "PyNaCl>=1.5.0",
    "sqlcipher3>=0.5.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
phantom = "messenger.__main__:main"
phantom-sim = "messenger.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
